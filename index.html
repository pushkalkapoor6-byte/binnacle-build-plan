<title>Binnacle Build Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: fixed left rail of sections, single reading column of spec cards,
   drill-down opens inline so nothing is lost on navigation. */
:root{
  --bg:#F4F6F8; --surface:#FFFFFF; --surface-2:#EDF1F5; --sunk:#E6ECF1;
  --ink:#101B26; --ink-2:#46586A; --ink-3:#6E8294;
  --line:#D9E1E8; --line-soft:#E9EFF4;
  --navy:#123A5E; --navy-2:#1C5789; --brass:#A96F0C; --brass-soft:#FAF1E0;
  --ok:#14654A; --ok-soft:#E3F1EB; --warn:#855408; --warn-soft:#FBF0DC;
  --crit:#99291D; --crit-soft:#FAE9E6; --info:#0C5F7C; --info-soft:#E2F0F5;
  --display:"Barlow","Helvetica Neue",Arial,sans-serif;
  --body:"Source Sans 3",-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:9px; --shadow:0 1px 2px rgba(16,27,38,.05),0 8px 24px rgba(16,27,38,.06);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0B131B; --surface:#111C26; --surface-2:#16242F; --sunk:#0E1821;
  --ink:#E6EDF3; --ink-2:#9FB2C2; --ink-3:#778EA1;
  --line:#22323F; --line-soft:#1B2935;
  --navy:#5FA3D8; --navy-2:#7FBBEA; --brass:#D9A13C; --brass-soft:#2A2113;
  --ok:#5FC79C; --ok-soft:#10271F; --warn:#D9A64A; --warn-soft:#2A2113;
  --crit:#E88A7D; --crit-soft:#2C1714; --info:#6CC0DB; --info-soft:#0E242B;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0B131B; --surface:#111C26; --surface-2:#16242F; --sunk:#0E1821;
  --ink:#E6EDF3; --ink-2:#9FB2C2; --ink-3:#778EA1;
  --line:#22323F; --line-soft:#1B2935;
  --navy:#5FA3D8; --navy-2:#7FBBEA; --brass:#D9A13C; --brass-soft:#2A2113;
  --ok:#5FC79C; --ok-soft:#10271F; --warn:#D9A64A; --warn-soft:#2A2113;
  --crit:#E88A7D; --crit-soft:#2C1714; --info:#6CC0DB; --info-soft:#0E242B;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit}

.wrap{display:grid;grid-template-columns:236px minmax(0,1fr);gap:0;
  max-width:1420px;margin:0 auto;min-height:100%}

/* ---- rail ---- */
.rail{border-right:1px solid var(--line);padding-block:22px 40px;padding-inline:16px 14px;
  position:sticky;top:env(safe-area-inset-top,0px);align-self:start;max-height:100vh;overflow-y:auto}
.mast{margin-bottom:22px}
.mast .mk{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:-.02em;line-height:1}
.mast .sb{font-size:11px;color:var(--ink-3);letter-spacing:.1em;text-transform:uppercase;
  margin-top:6px;font-weight:600}
.railnav{display:flex;flex-direction:column;gap:1px}
.railnav button{display:flex;align-items:baseline;gap:9px;background:none;border:none;
  text-align:left;padding:7px 9px;border-radius:7px;cursor:pointer;color:var(--ink-2);
  font-size:13.5px;font-weight:600;width:100%}
.railnav button:hover{background:var(--surface-2);color:var(--ink)}
.railnav button[aria-current="true"]{background:var(--navy);color:#fff}
.railnav button .nx{font-family:var(--mono);font-size:10.5px;opacity:.65;flex:none;width:16px}
.railnav button[aria-current="true"] .nx{opacity:.8}
.railfoot{margin-top:22px;padding-top:16px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--ink-3);line-height:1.5}
.tgl{display:block;margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:6px;
  padding:5px 10px;font-size:11.5px;cursor:pointer;color:var(--ink-2);font-weight:600}
.tgl:hover{border-color:var(--navy)}

/* ---- main ---- */
.main{padding-block:26px 72px;padding-inline:28px 28px;min-width:0}
.sec{display:none}
.sec.on{display:block}
.sechead{margin-bottom:22px;padding-bottom:16px;border-bottom:2px solid var(--line)}
.sechead .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;
  color:var(--brass);font-weight:600;text-transform:uppercase}
.sechead h2{font-size:30px;font-weight:700;margin-top:7px;line-height:1.1}
.sechead .lede{color:var(--ink-2);margin-top:9px;max-width:66ch;font-size:15.5px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:18px 20px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:14px}
.cols{display:grid;gap:14px}
.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:980px){.c3,.c4{grid-template-columns:repeat(2,minmax(0,1fr))}}

h3.ch{font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);
  font-weight:700;margin-bottom:12px;margin-top:28px}
h3.ch:first-child{margin-top:0}

.lead{font-size:16.5px;line-height:1.6;color:var(--ink-2);max-width:68ch}
.lead strong{color:var(--ink);font-weight:600}

/* ---- principle / numbered ---- */
.prin{display:grid;grid-template-columns:30px minmax(0,1fr);gap:0 14px;align-items:start}
.prin .n{font-family:var(--mono);font-size:12px;color:var(--brass);font-weight:600;padding-top:2px}
.prin b{display:block;font-family:var(--display);font-size:15.5px;font-weight:600;margin-bottom:3px}
.prin span{font-size:14px;color:var(--ink-2);display:block}

/* ---- pills ---- */
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;
  font-size:11px;font-weight:600;letter-spacing:.015em;white-space:nowrap;
  background:var(--surface-2);color:var(--ink-2);font-family:var(--body)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.brass{background:var(--brass-soft);color:var(--brass)}
.pill.solid{background:var(--navy);color:#fff}
.pills{display:flex;gap:5px;flex-wrap:wrap}

code,.mono{font-family:var(--mono);font-size:.88em}
.tag{font-family:var(--mono);font-size:11px;background:var(--sunk);color:var(--ink-2);
  padding:1px 6px;border-radius:4px;white-space:nowrap}

/* ---- journey ---- */
.jlist{display:flex;flex-direction:column;gap:9px}
.jstage{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.jstage.open{border-color:var(--navy)}
.jhead{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:14px;align-items:center;
  padding:13px 16px;cursor:pointer;background:none;border:none;width:100%;text-align:left}
.jhead:hover{background:var(--surface-2)}
.jhead .jn{font-family:var(--mono);font-size:12px;font-weight:600;color:#fff;background:var(--navy);
  border-radius:6px;padding:4px 0;text-align:center}
.jstage.open .jhead .jn{background:var(--brass)}
.jhead .jt{font-family:var(--display);font-size:16px;font-weight:600;line-height:1.25}
.jhead .jw{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.jhead .jc{font-family:var(--mono);font-size:17px;color:var(--ink-3);transition:transform .15s}
.jstage.open .jhead .jc{transform:rotate(45deg);color:var(--brass)}
.jbody{padding:4px 16px 18px;border-top:1px solid var(--line-soft)}

.dgrid{display:grid;grid-template-columns:132px minmax(0,1fr);gap:10px 16px;
  font-size:14px;margin-top:14px}
.dgrid dt{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);
  font-weight:700;padding-top:3px}
.dgrid dd{margin:0;color:var(--ink-2);min-width:0}
.dgrid dd strong{color:var(--ink);font-weight:600}
.dgrid ul{margin:0;padding-left:17px}
.dgrid li{margin-bottom:3px}
.dgrid li:last-child{margin-bottom:0}
@media (max-width:700px){.dgrid{grid-template-columns:1fr;gap:3px 0}
  .dgrid dt{margin-top:11px}}

/* ---- tables ---- */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;padding:9px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);
  font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);font-weight:700;
  white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line-soft);vertical-align:top}
tbody tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.ctr,th.ctr{text-align:center}
.tw.tight td,.tw.tight th{padding:7px 10px;font-size:12.8px}

/* ---- matrix ---- */
.mx td.ctr{font-family:var(--mono);font-size:12px;font-weight:600}
.mx .y{color:var(--ok)}
.mx .n{color:var(--ink-3);opacity:.45}
.mx .p{color:var(--warn)}
.mx .a{color:var(--navy-2)}
.mxkey{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-top:11px}
.mxkey b{font-family:var(--mono);margin-right:5px}

/* ---- filter bar ---- */
.fbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.fbar select,.fbar input{padding:6px 10px;border:1px solid var(--line);border-radius:7px;
  background:var(--surface);font-size:13px;color:var(--ink);outline:none}
.fbar select:focus,.fbar input:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(28,87,137,.14)}
.fbar input{min-width:190px}
.fbar .ct{margin-left:auto;font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* ---- rule block ---- */
.rule{display:grid;grid-template-columns:58px minmax(0,1fr);gap:12px;padding:11px 13px;
  border:1px solid var(--line);border-radius:7px;background:var(--surface)}
.rule + .rule{margin-top:7px}
.rule .rid{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--brass)}
.rule .rt{font-size:14px;font-weight:600;margin-bottom:3px}
.rule .rp{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);
  background:var(--sunk);padding:4px 7px;border-radius:5px;margin-top:5px;
  overflow-x:auto;white-space:pre}
.rule .rd{font-size:13.3px;color:var(--ink-2)}

/* ---- note ---- */
.note{border-left:3px solid var(--navy);background:var(--surface);border:1px solid var(--line);
  border-left-width:3px;border-radius:7px;padding:12px 14px;font-size:14px;color:var(--ink-2)}
.note b{color:var(--ink)}
.note.brass{border-left-color:var(--brass)}
.note.crit{border-left-color:var(--crit)}
.note.ok{border-left-color:var(--ok)}

/* ---- state machine ---- */
.sm{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;margin-top:8px}
.sm .st{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;
  padding:3px 9px;font-weight:600;font-size:12px}
.sm .st.term{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.sm .st.bad{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.sm .ar{color:var(--ink-3);font-family:var(--mono);font-size:11px}

/* ---- phase ---- */
.ph{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.ph + .ph{margin-top:11px}
.phh{display:flex;gap:12px;align-items:baseline;padding:13px 16px;background:var(--surface-2);
  border-bottom:1px solid var(--line);flex-wrap:wrap}
.phh .pn{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--brass)}
.phh h4{font-size:16px;font-weight:600;flex:1;min-width:140px}
.phb{padding:14px 16px}

.ent{border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:11px 13px}
.ent .en{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--navy-2)}
.ent .ed{font-size:12.8px;color:var(--ink-2);margin-top:4px}
.ent .ef{font-size:11.5px;color:var(--ink-3);margin-top:6px;font-family:var(--mono);line-height:1.5}

.copybtn{background:var(--surface);border:1px solid var(--line);border-radius:7px;
  padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer;color:var(--ink-2)}
.copybtn:hover{border-color:var(--navy);color:var(--ink)}

.src{font-size:12.5px;color:var(--ink-3);margin-top:7px}
.src a{color:var(--navy-2)}

a{color:var(--navy-2)}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

@media (max-width:860px){
  .wrap{grid-template-columns:1fr}
  .rail{position:static;max-height:none;border-right:none;border-bottom:1px solid var(--line);
    padding-inline:16px;padding-block:18px 14px}
  .railnav{flex-direction:row;overflow-x:auto;gap:5px;padding-bottom:4px}
  .railnav button{white-space:nowrap;width:auto;background:var(--surface);border:1px solid var(--line)}
  .railfoot{display:none}
  .main{padding-inline:16px;padding-block:20px 56px}
  .c2{grid-template-columns:1fr}
  .sechead h2{font-size:25px}
}
</style>
<div class="wrap">
  <nav class="rail" aria-label="Plan sections">
    <div class="mast">
      <div class="mk">Binnacle</div>
      <div class="sb">Build plan v2</div>
    </div>
    <div class="railnav" id="railnav"></div>
    <div class="railfoot">
      Placement and sea service, for the institute.<br>
      Enquiry through Certificate of Competency.
      <button class="tgl" id="themeBtn" type="button">Switch theme</button>
    </div>
  </nav>
  <main class="main" id="main"></main>
</div>
<script>
"use strict";
/* ===========================================================
   THE JOURNEY — empty portal to Certificate of Competency
   =========================================================== */
var JOURNEY = [
{ n:"J1", t:"Institute setup and configuration", w:"Head of Institute · Registrar · System",
  purpose:"The portal arrives empty. Everything below is configured by the institute itself, without the vendor, and every step is counted from what is on record rather than ticked off a list.",
  sys:[
    "Guided setup checklist: stages and steps, each one marked done only because the records that satisfy it exist. Remove the records and the step opens again.",
    "Institute profile, approval reference, address and contacts — what every register, letter and privacy notice carries.",
    "Course approvals with intake cap, issue date and validity, so an over-enrolment is refused rather than reported later.",
    "Programmes, academic years, terms, subjects, assessment blueprint, pass thresholds and grading scales whose bands cover every mark with no gap and no overlap.",
    "Document checklists per stage, certificate types, document templates, notification rules and roll-number series per batch.",
    "Master lists the institute owns — vessel types, ranks, ports — so no drop-down is ever free text.",
    "Staff, roles and granular rights, with role templates the institute can edit rather than fixed roles it cannot.",
    "Demonstration data removed in one action, so the same portal that sells the product becomes the one that runs it.",
    "Sign-off separates what blocks enrolment from what blocks grading, and says which is outstanding."],
  data:["Institute","CourseApproval","Programme","AcademicYear","Term","Subject","AssessmentBlueprint","GradingScale","DocumentChecklist","CertificateType","NotificationRule","RollNumberSeries","MasterList","Role","SetupStep"],
  dec:["Whether this institute can start enrolling, and precisely which step is holding it up.",
    "Whether a programme can produce a result at all — terms, thresholds and a grading scale are a different gate from enrolment.",
    "Whether the approval under which a batch is being filled is still valid and still has seats."],
  risk:["Setup signed off with programmes that have no terms, so cadets are enrolled into something that cannot be graded.",
    "A batch opened with no roll-number series, so cadets are admitted with no roll number and nothing says so.",
    "Role templates copied from another institute that do not match this one's actual separation of duties."],
  intl:"Approval references and the authority that issues them differ. Hold the approving authority as a field rather than assuming one." },

{ n:"J1", t:"Enquiry and application", w:"Prospect · Admissions Officer · Counsellor",
  purpose:"Capture a prospective candidate once, cleanly, and never retype their details again. Everything downstream hangs off the record created here.",
  sys:[
    "Public application form writes straight into the candidate register — no spreadsheet in between.",
    "Duplicate detection on mobile, email and ID number at the moment of entry, not during a later clean-up.",
    "Application fee captured against the application, with an auto-numbered receipt.",
    "Source attribution: counsellor, agent, referral, campaign or walk-in, recorded on the record itself.",
    "Incomplete applications stay visible as a working queue rather than disappearing."],
  data:["Candidate","Application","Payment","SourceAttribution"],
  dec:["Which channels actually convert, not just which generate enquiries.",
    "Where applications stall, by stage and by counsellor.",
    "Whether fee collection is keeping pace with application volume."],
  risk:["The same person applies twice under slightly different spellings.",
    "Fee paid but the form was never completed — money received against nothing.",
    "Agent-sourced candidates disputed later when a commission is claimed."],
  intl:"Identity is the passport, not a national ID. No national entrance test applies. An overseas representative or agent becomes a tracked channel with its own agreement record." },

{ n:"J2", t:"Eligibility screening and entrance assessment",
  w:"Admissions Officer · System",
  purpose:"Apply the published eligibility criteria as code rather than as a reading of a brochure, so two officers reach the same answer on the same file.",
  sys:[
    "Eligibility runs against the course master: age window computed from date of birth at the course start date, subject marks, accepted board list, and the exclusions the course carries.",
    "Every rejection returns a reason code, not just a verdict — this is what you quote back to a parent.",
    "Online assessment captured by section, not as a single total, so weak areas are visible from day one.",
    "National entrance test rank recorded where the course requires it.",
    "Borderline files route to a referral queue for a human decision, with the reason preserved."],
  data:["EligibilityCheck","TestAttempt","TestSection","ReferralDecision"],
  dec:["Which entrance sections predict later academic performance — this is the data that lets you improve the test.",
    "Whether the cut-off is set where it should be, judged against how past cohorts performed.",
    "Which officer or panel is referring unusually often."],
  risk:["Improvement and compartment candidates sitting outside the standard rule.",
    "A board not on the accepted list, discovered after the fee was taken.",
    "Final marksheet not yet issued at the time of application."],
  intl:"Qualification equivalence has to be assessed rather than matched, and evidence of English proficiency replaces the school English mark. Expect a manual referral by default." },

{ n:"J3", t:"Interview and medical",
  w:"Interview panel · Approved medical examiner · Admissions",
  purpose:"Make the two human judgements — can this person do the job, and are they fit for sea service — recorded, comparable and defensible.",
  sys:[
    "Slot booking with panel assignment, so a candidate books rather than being told to wait.",
    "Structured scorecard per competency instead of free text: communication, motivation, aptitude, awareness of the career, physical confidence.",
    "Referral to a doctor drawn from the approved examiner list held in the system, never typed in free text.",
    "Medical result recorded as fit, temporarily unfit or unfit, each with a reason and, where relevant, a re-examination date.",
    "Panel-level reporting so that scoring drift between panels becomes visible."],
  data:["InterviewSlot","InterviewScore","MedicalExamination","ApprovedExaminer"],
  dec:["Whether panels are scoring consistently — the same candidate should not depend on who interviewed them.",
    "Which medical grounds are causing the most rejections, and whether candidates can be warned earlier.",
    "How many interview slots to open for a target intake, based on past show and conversion rates."],
  risk:["Candidate does not attend and the slot is wasted.",
    "Colour vision failure found only at the medical, after months of candidate effort.",
    "Temporarily unfit candidates lost entirely because nobody followed up on the re-examination date."],
  intl:"The examination must be done by a practitioner the relevant flag state accepts. Build the examiner list so it can hold more than one accepting authority." },

{ n:"J4", t:"Merit list, offer and seat booking",
  w:"Admissions Officer · Head of Institute",
  purpose:"Turn four separate scores into one defensible ranking, and manage the waitlist as seats move.",
  sys:[
    "Merit computed from a configurable weighted formula across academics, entrance assessment, interview and medical clearance — weights are a setting, not a code change.",
    "Provisional offer generated with a validity date; lapse is automatic when the date passes.",
    "Seat booking against a batch, with live seat counts.",
    "Waitlist moves automatically when an offer lapses or is declined, and the movement is logged.",
    "Published merit list export for the notice board, generated from the same data the decision used."],
  data:["MeritList","Offer","SeatBooking","Waitlist"],
  dec:["Where to set the cut-off for a target intake.",
    "Conversion by rank band — how deep into the list you need to go to fill the batch.",
    "Whether to open an additional batch."],
  risk:["Two candidates tie and the system has no declared tie-breaker.",
    "Offer lapses silently and the seat is lost for the intake.",
    "Waitlist movement disputed because the order was changed by hand."],
  intl:"Offers need a longer validity window to allow for visa processing, and seat booking has to tolerate a payment arriving from abroad." },

{ n:"J5", t:"Fee, sponsorship and education loan",
  w:"Accounts · Admissions · Candidate · Bank",
  purpose:"Know, at any moment, who owes what and whose funding is at risk — before it becomes a drop-out.",
  sys:[
    "Fee schedule defined per batch with instalments and due dates; receipts numbered automatically.",
    "Sponsorship letter generated from the candidate's own record for submission to a bank.",
    "Loan application tracked through its stages so a delay is visible while it can still be fixed.",
    "Ageing view of outstanding balances by batch and by due date.",
    "Refund and forfeiture rules applied as a policy setting rather than a case-by-case decision."],
  data:["FeeSchedule","FeeInstalment","Receipt","SponsorshipLetter","LoanApplication","RefundRequest"],
  dec:["Cash position for the coming quarter.",
    "Which candidates are at real risk of dropping out for funding reasons, early enough to help.",
    "Which banks process sponsored applications fastest — useful advice to give the next cohort."],
  risk:["Loan sanctioned but disbursed late, after the course has started.",
    "Instalment due dates not aligned to the academic calendar.",
    "Refund claimed on a non-refundable component."],
  intl:"Foreign remittance needs the regulatory documentation recorded against the receipt, and currency and exchange rate must be stored with the payment, not inferred later." },

{ n:"J6", t:"Enrolment and onboarding",
  w:"Registrar · Document Controller · Candidate",

{ id:"E1", name:"Admission eligibility", when:"On application submission and on any edit to a qualifying field",
  why:"Two officers should reach the same answer on the same file, and a rejected parent should get a reason rather than an opinion.",
  out:"Eligible · Referred · Not eligible, each with the reason codes that produced it",
  rules:[
    ["A1","Age within the course window","age(dob, course.startDate) between course.ageFrom and course.ageTo","Computed at the course start date, not at application date — this catches the candidate who turns ineligible between the two."],
    ["A2","Qualifying aggregate met","aggregatePct >= course.minAggregate","Subject combination checked separately so a shortfall names the subject."],
    ["A3","Language mark met","englishPct >= course.minEnglish","Replaced by a proficiency test result for candidates assessed on that basis."],
    ["A4","Board on the accepted list","board in course.acceptedBoards","Boards outside the list route to referral rather than rejection."],
    ["A5","Excluded pathway not used","board not in course.excludedPathways","Distance and open-schooling exclusions live here as data."],
    ["A6","Entrance assessment cleared","onlineScore >= course.minTestScore","Section minima applied where the course declares them."],
    ["A7","External entrance rank present where required","course.requiresExternalTest implies externalRank is not null",""],
    ["A8","Medical fitness recorded as fit","medical.status = 'Fit'","Temporarily unfit holds the file open with a re-examination date rather than closing it."],
    ["A9","Marksheet evidence submitted","document('qualifying marksheet').status = 'Verified'","Provisional results allow a conditional offer, flagged as such."]]},

{ id:"E2", name:"Deployment screening", when:"Before a cadet is put forward for a berth, and again before release",
  why:"The second run matters more than the first: a document valid at allotment can expire before the contract ends.",
  out:"Clear · Clear with advisories · Documents pending · Medical pending · Not eligible",
  rules:[
    ["D1","Ashore phase complete","batch.endDate <= today","Blocking."],
    ["D2","Attendance at or above the minimum","attendancePct >= settings.minAttendance","Blocking. Stated to the cadet in days short, not only as a percentage."],
    ["D3","Academic aggregate met","aggregatePct >= settings.minAggregate","Blocking."],
    ["D4","No open re-attempt","count(assessments where result = 'Re-attempt') = 0","Blocking."],
    ["D5","All mandatory short courses issued","count(modules where status = 'Issued') = course.mandatoryModuleCount","Blocking."],
    ["D6","Seafarer identification number recorded","cadet.identityNumber is not empty","Blocking."],
    ["D7","Discharge certificate recorded","cadet.dischargeCertNo is not empty","Blocking."],
    ["D8","Passport valid through the contract","passportExpiry >= contractEnd + settings.docBuffer","Blocking. This is the forward check, not a check against today."],
    ["D9","Medical valid through the contract","medicalExpiry >= contractEnd","Blocking where the flag requires cover for the full period; advisory otherwise."],
    ["D10","No document outstanding","count(documents where status = 'Not submitted') = 0","Blocking."],
    ["D11","Fee account clear","feeBalance = 0","Advisory by default; institutes may set it blocking."],
    ["D12","Sponsor holds a current agreement","company.agreementStatus = 'Active'","Advisory."],
    ["D13","Nationality permitted on the flag","cadet.nationality in vessel.flag.permittedNationalities","Blocking where it applies at all."]]},

{ id:"E3", name:"Competency and gap", when:"On every mark entry, and nightly for trend recomputation",
  why:"A mark tells a cadet they did badly. A gap tells them what to do on Tuesday.",
  out:"A ranked list of weak areas, each with a figure, a reference point and the evidence behind it",
  rules:[
    ["G1","Score per competency area","weightedMean(items tagged area, weight = recency × assessmentWeight)","Recent work counts for more; an early failure recovered from should not follow a cadet forever."],
    ["G2","Reference set","{ passMark, cohortMedian, companyBenchmark, ownTrend }","Four reference points, because one number alone is not interpretable."],
    ["G3","Gap value","max(0, reference − score) for the active reference","The active reference is the cadet's own choice of target, defaulting to the pass mark."],
    ["G4","Ranking","order by gap × areaWeight × assessmentDensity","Density guards against ranking an area assessed once above an area assessed ten times."],
    ["G5","Evidence trail","every contributing item, its date, its mark and its maximum","Shown with the gap. A gap without evidence gets argued with."],
    ["G6","Confidence flag","areas with fewer than settings.minItems are marked provisional","Prevents a single bad practical from dominating the list."],
    ["G7","Trend","slope over the last settings.trendWindow assessments in the area","Improving, flat or declining, stated as a direction rather than a number."]]},

{ id:"E4", name:"Nudge", when:"Scheduled evaluation, with immediate firing on threshold-crossing events",
  why:"Information nobody acts on is decoration. A nudge names the action, carries a deadline and escalates if ignored.",
  out:"A delivered message to the cadet, with an escalation to the mentor when it goes unanswered",
  rules:[
    ["N1","Trigger","a declared condition on a metric — attendance, gap, document expiry, phase schedule, submission due",""],
    ["N2","Audience","the cadet, the mentor, or both, declared per rule",""],
    ["N3","Content","what is wrong, what to do, by when, and the one link that does it","A nudge that only reports a problem is a complaint."],
    ["N4","Cadence","minimum interval between repeats of the same rule for the same cadet","The single most important setting. Too frequent and every nudge is ignored."],
    ["N5","Snooze","the cadet may defer once, which is recorded","A deferral that is tracked is more useful than a nudge that is silently dismissed."],
    ["N6","Escalation","unanswered after settings.escalateAfter, the mentor is notified",""],
    ["N7","Suppression","no nudge fires while a related correction request is open","Prevents the system badgering a cadet about something already reported."],
    ["N8","Effectiveness","the metric that triggered the nudge is re-measured after a set interval","This is what tells you whether the nudges work at all."]]},

{ id:"E5", name:"Benchmark and readiness", when:"On demand, and refreshed when a blueprint or a competency score changes",
  why:"'Prepare well for the company test' is not advice. 'You are eleven points short on cargo work for this company' is.",
  out:"A readiness percentage per company with the contribution of each area shown",
  rules:[
    ["B1","Blueprint","per company: areas, weights, format, duration, historical qualifying level","Maintained by the placement officer with a review date and a named owner."],
    ["B2","Readiness","sum over areas of ( min(score / blueprintTarget, 1) × weight )","Capped per area so strength in one area cannot mask a failure in another."],
    ["B3","Qualifying likelihood","readiness compared with the qualifying level of past attempts","Expressed as a band, never as a probability — the sample is too small to claim more."],
    ["B4","Contribution view","each area's points gained against points available","This is what turns a score into a study plan."],
    ["B5","Eligibility pre-filter","nationality, flag and course restrictions applied before scoring","A perfect readiness score against a company that cannot employ the cadet is worse than no score."],
    ["B6","Blueprint staleness","flagged when past its review date","A stale benchmark quietly misleads a whole cohort."]]},

{ id:"E6", name:"Shipboard training completion", when:"Continuously during the sea phase; formally at mid-term and at final assessment",
  why:"This is the engine that protects the institute. A completion certificate issued on an incomplete file is the most damaging error available, and these criteria are what make the decision defensible.",
  out:"Per-criterion met or short, with the figure and the shortfall, visible to the cadet throughout the sea phase",
  note:"The figures below follow the published structured shipboard training guidelines for the deck pathway. Every one is held as a setting, because they differ by course, by pathway and by circular revision. Confirm each against the current circular for the course before go-live, and record the circular reference against the setting.",
  rules:[
    ["C1","Sea service","seaDays >= 18 months","Joining and sign-off days are not counted. This single exclusion is the most common cause of a file falling short by a few days."],
    ["C2","Record-book tasks","proficientTasks / totalTasks >= 80%","Proficiency is the assessing officer's decision, not simply a completed entry."],
    ["C3","Bridge watchkeeping","bridgeHours >= 720","Six months of watchkeeping, certified by the Master."],
    ["C4","Port and cargo watchkeeping","cargoWatches >= 60 of 6 hours each","360 hours in total, logged as watches rather than as a running total."],
    ["C5","Engine room watchkeeping","engineHours >= 20",""],
    ["C6","Steering","steeringHours >= 40, including a Master's test","The test is a separate flag, not an assumption from the hours."],
    ["C7","Ship-type tasks","for each ship type sailed: typeTasksProficient >= 80%","Assessed per type, with a pro-rata allowance for short periods on a type."],
    ["C8","Generic projects","all generic projects complete","100%, not 80%."],
    ["C9","Ship-type projects","all projects complete for each ship type sailed",""],
    ["C10","Activity workbook","completedItems >= 80%",""],
    ["C11","Supplementary workbook","completedItems >= 80% where the course requires one",""],
    ["C12","Monthly reviews","every month of service carries a signed Master's review","A missing month is a gap in the evidence chain, not a formality."],
    ["C13","Mid-term review","held between 6 and 12 months of service, report issued","Blocking at final assessment if never held."],
    ["C14","Final assessment","written and oral assessment conducted and passed",""],
    ["C15","Sea service confirmed","each period confirmed by the employing company","The institute's figure must agree with the company's."]]},

{ id:"E7", name:"Document verification and expiry", when:"On submission, on verification, and daily for expiry",
  why:"This is what replaces the shared drive. A file in a folder has no owner, no state and no expiry.",
  out:"A verification queue with an owner on every item, and an expiry watchlist with lead times",
  rules:[
    ["V1","Requirement set","generated per cadet from course and nationality","The cadet sees only what applies to them."],
    ["V2","Intake","an uploaded file or an external link; a link is validated for read access at submission","A link that works today and breaks tomorrow is the classic failure, so the link is re-checked on a schedule."],
    ["V3","Authority","only a role with verification authority for that document type may verify","Recorded with the verifier's identity."],
    ["V4","Query","a rejection must carry a reason the cadet can act on","'Rejected' alone generates a phone call."],
    ["V5","Expiry watch","alert at each configured lead time before expiry","Lead times differ by document type."],
    ["V6","Forward validity","for deployment, validity is checked to the contract end date","See D8."],

{ id:"E8", name:"Statutory registers", when:"On demand, one register at a time",
  why:"The real test of an institute's system is whether it can hand an inspector a dated, complete register in a minute. Ten registers, generated from the live records, never maintained by hand alongside them.",
  out:"A dated register on screen, as CSV, and as a paginated PDF carrying the institute's name and page numbers",
  note:"Register numbering and content follow the set an inspector asks for. Confirm the current set and its headings against the circular in force before build, and record the reference against each register definition.",
  rules:[
    ["R1","Company enquiry and contact","entered by hand","One of only two registers with no source record elsewhere in the portal."],
    ["R2","Campus drives","drives and their participants",""],
    ["R3","Company and agreements","companies with relationship type, instrument and validity","Inspection item."],
    ["R4","Sea-berth tie-ups","berth commitments against live sponsorships","Inspection item. Blank here means the berth commitment was never recorded as a field."],
    ["R5","Sponsorship letters issued","every offer past draft",""],
    ["R6","Placement records","sponsorships with the confirmed joining","Inspection item."],
    ["R7","Cadet joining","confirmed joinings","Inspection item."],
    ["R8","Correspondence","entered by hand",""],
    ["R9","Complaints and grievances","the fact of a complaint and its state, never its content","The content stays with the institute. The register proves the complaint was received and handled."],
    ["R10","Fees charged to cadets","nil by construction","There is no field anywhere in the product that can populate this register. If it can ever be non-empty, the product is unlawful. See non-negotiable 01."],
    ["R11","Generation is per register","never all ten at page load","Ten registers generated at once is a page that hangs, which is exactly how an inspection goes badly."]]},

{ id:"E9", name:"Delete, dependants and restore", when:"On any delete request",
  why:"An institute that cannot correct a mistyped record will keep a second set of records outside the portal, and then the portal is not the record.",
  out:"Deleted with a reason, or refused with the dependants named and counted",
  rules:[
    ["X1","Right","the actor holds delete on that entity","Delete is a separate right from edit, granted per entity."],
    ["X2","Reason","mandatory, kept in the log","A delete with no reason is indistinguishable from an accident."],
    ["X3","Dependants","refused while any other record references it; the refusal lists them with counts","'This batch still has 7 cadets and 2 drives' — not 'cannot delete'."],
    ["X4","Flag, not removal","the row stays, marked deleted, with actor, reason and time",""],
    ["X5","Restore","a separate transition with its own right and its own log entry","Never a silent reversal."],
    ["X6","System-created links","anything the portal created itself — a cadet's login, an enquiry raised behind a one-step admission — must be removable through the same path","Otherwise the parent can never be deleted and a typo at admission becomes permanent. This is a real failure mode, not a hypothetical one."],
    ["X7","Lists","deleted records hidden by default, visible under an explicit filter",""]]},

{ id:"E10", name:"Spreadsheet import", when:"On upload, on preview and on commit",
  why:"No institute will type in three years of history, and no integration arrives on time. Import is the primary path into the product, not the fallback.",
  out:"An accepted set, a refused set with a reason on each row, and a commit that can be reversed",
  rules:[
    ["I1","Template","generated from the entity definition","So the template can never drift from the form."],
    ["I2","Validation","the same binder and the same rules the form uses","One implementation. Two implementations diverge within a month."],
    ["I3","Partial acceptance","good rows commit; bad rows return with the reason on the row","A file of three hundred rows rejected whole teaches people to stop using import."],
    ["I4","Duplicates","detected on the entity's natural key, with skip or update chosen by the user",""],
    ["I5","Pending rows","a rule evaluating a row can see the rows accepted earlier in the same file","Without this, two hundred cadets import cleanly into a batch with one seat."],
    ["I6","Rights","create on the target entity, and edit where the file updates","Import must never be a route around a permission."],
    ["I7","Rollback","reversible for a configured window; updated rows restore to their previous values","Deleting rows an import had only updated is the classic rollback bug."]]},

{ id:"E11", name:"Result set", when:"On mark entry, verification, publication and revision",
  why:"A published mark is a statement the institute will be asked to defend years later, after the thresholds behind it have changed. It has to be reproducible.",
  out:"A result set in exactly one of draft, verified, published or revised, with its working preserved",
  rules:[
    ["S1","Mark bounds","0 <= mark <= component.maximum, with absent as a distinct value from zero","An absent cadet and a cadet who scored nothing are not the same thing."],
    ["S2","Completeness","a set cannot be verified while any mark is missing; the missing ones are named by cadet",""],
    ["S3","Segregation of duties","verification refused for anyone who entered a mark in the set","The single most important control in the academic record."],
    ["S4","Publication","only a verified set publishes, and publication locks it",""],
    ["S5","Rule values, not references","a published set stores the pass mark, subject minima, weights, bands and the roster as values","So the grade recomputes identically in five years, after every one of those settings has moved. Storing a reference to a mutable row is the bug that looks correct until it matters."],
    ["S6","Revision","a correction is a new revision with a reason; the superseded revision stays and says so",""],
    ["S7","Visibility","a cadet sees a result only once its set is published",""]]}

["Stable releases only","build",

["Everything has a provision","build",

["Nothing is hard-deleted","data",

["Two dates on anything that counts days","data",
 "The date a thing took effect and the date it was entered are different fields on every dated record. Arithmetic uses the effective date; the audit trail uses the recorded date. A status back-dated on Friday to take effect last Monday must count from Monday and be auditable to Friday. Retrofitting this means revisiting every calculation in the product."],
["Every write and every read is logged","data",
 "Writes carry before and after, the actor, the reason, the address and a correlation id. Reads of a cadet's file are logged too, because a consent gate is only as good as the record of what was actually disclosed and to whom. The log is append-only in the application and at the database, where triggers refuse an update or a delete on the log itself."],

function el(t,c,x){var n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=String(x);return n;}

function tbl(cols,rows,render,cls){
  var w=el("div","tw"+(cls?" "+cls:""));var t=el("table");
  var h=el("thead"),hr=el("tr");
  cols.forEach(function(c){var th=el("th",c.a||null,c.l);if(c.w)th.style.width=c.w;hr.appendChild(th);});
  h.appendChild(hr);t.appendChild(h);
  var b=el("tbody");
  rows.forEach(function(r,i){
    var tr=el("tr");
    render(r,i).forEach(function(cell,j){
      var td=el("td",cols[j]&&cols[j].a?cols[j].a:null);
      if(cell instanceof Node)td.appendChild(cell);else td.innerHTML=cell==null?"—":String(cell);
      tr.appendChild(td);
    });
    b.appendChild(tr);
  });
  t.appendChild(b);w.appendChild(t);return w;
}

    var hd=el("div");hd.style.cssText="display:flex;gap:9px;align-items:baseline;flex-wrap:wrap;margin-bottom:4px";
    var b=el("b",null,x[0]);b.style.cssText="display:block;font-family:var(--display);font-size:15.5px";
    hd.appendChild(b);
    hd.appendChild(pill(kinds[x[1]][0],kinds[x[1]][1]));

  });
  f.appendChild(w);
  var n=el("div","note crit");n.style.marginTop="18px";
  n.innerHTML="<b>The one that decides whether the product is lawful.</b> Rule 01 is not a preference. If any part of the placement side of the portal can hold a figure chargeable to a cadet, the institute using it is exposed and so is whoever built it. The check is simple and worth running on every release: search the schema for a monetary column on any placement, sponsorship, berth, offer, joining or sea-service table. There should be none.";
  f.appendChild(n);
  return f;
}

/* ---------- shell ---------- */
var RENDER={overview:secOverview,nonneg:secNonNeg,journey:secJourney,roles:secRoles,
  matrix:secMatrix,features:secFeatures,engines:secEngines,data:secData,
  decisions:secDecisions,build:secBuild,tech:secTech,open:secOpen};
var cur="overview";

function go(k){
  if(!RENDER[k])k="overview";
  cur=k;
  var m=$("#main");m.innerHTML="";
  var s=el("div","sec on");
  s.appendChild(RENDER[k]());
  m.appendChild(s);
  document.querySelectorAll("#railnav button").forEach(function(b){
    var on=b.dataset.k===k;
    b.setAttribute("aria-current",on?"true":"false");
    if(on&&b.scrollIntoView)b.scrollIntoView({block:"nearest",inline:"nearest"});
  });
  try{localStorage.setItem("binnacle.sec",k);}catch(e){}
  m.scrollTop=0;window.scrollTo(0,0);
}

(function init(){
  var nav=$("#railnav");
  SECTIONS.forEach(function(s){
    var b=el("button");b.type="button";b.dataset.k=s.k;
    b.appendChild(el("span","nx",s.x));
    b.appendChild(el("span",null,s.n));
    b.onclick=function(){location.hash=s.k;go(s.k);};
    nav.appendChild(b);
  });
  $("#themeBtn").onclick=function(){
    var r=document.documentElement;
    var dark=r.getAttribute("data-theme")==="dark"||
      (!r.getAttribute("data-theme")&&window.matchMedia("(prefers-color-scheme: dark)").matches);
    r.setAttribute("data-theme",dark?"light":"dark");
    try{localStorage.setItem("binnacle.theme",dark?"light":"dark");}catch(e){}
  };
  try{var t=localStorage.getItem("binnacle.theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}
  var start=(location.hash||"").replace("#","");
  if(!RENDER[start]){try{start=localStorage.getItem("binnacle.sec");}catch(e){}}
  go(RENDER[start]?start:"overview");
  window.addEventListener("hashchange",function(){
    var k=(location.hash||"").replace("#","");
    if(RENDER[k]&&k!==cur)go(k);
  });
})();

</script>
